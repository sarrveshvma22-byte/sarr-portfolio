<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Preload exact Timeless Sans Grotesk fonts -->

    <style>
      /* First paint before any script: black, one star (jehaduddin.vercel.app style) */
      html { background: #000; color: #e9e7e1; }
      body { margin: 0; background: #000; }
      #star {
        position: fixed;
        left: 58%;
        top: 46%;
        width: 4px;
        height: 4px;
        margin: -2px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 6px 1px rgba(255, 255, 255, 0.6);
        opacity: 0.25;
        pointer-events: none;
        z-index: 1;
      }
    </style>
  </head>
  <body class="bg-[#000000] text-[#e9e7e1] selection:bg-[#ff9d42] selection:text-black overflow-x-hidden antialiased">
    <!-- Solitary Star on First Paint -->
    <div id="star" aria-hidden="true"></div>
    <div id="root"></div>
